lineage:
  parents: []
  rationale: Custom ROCmFP4/FPX quant architecture for Strix Halo 32GB with WMMA Vulkan shaders.
objectives:
  primary:
  - tool_calling
  - code_generation
  - throughput
  secondary:
  - memory_efficiency
  not_optimized:
  - vision
constraints:
- Must use Vulkan WMMA with ROCmFPX kernel support (type 100/101).
- Native Wave64 compute shaders required for full SIMD occupancy.
tradeoffs:
- Requires charlie12345/ROCmFPX build rather than vanilla upstream llama.cpp.
- Flash attention is strictly mandatory for ROCmFP4 compute shaders.
